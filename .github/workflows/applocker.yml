name: App Locker

# Separate from the music app's pipeline: own tags (locker-vX.Y.Z), own release (locker-latest), own signing key.
#   • every push / pull request that touches app-locker/  ->  checks only (types, tests, debug build, emulator test)
#   • tag  locker-v1.2.0   or  Actions -> "App Locker" -> Run workflow (version 1.2.0)  ->  signed release APK (needs the private key)
#   • tag  locker-test-v1.2.0  ->  TEST APK signed with the public debug key, published as a pre-release "locker-test".
#     For trying the app on your own phone when you have no private key yet. Not an official release.
on:
  push:
    branches: [main]
    paths: ["app-locker/**", ".github/workflows/applocker.yml", ".github/scripts/locker-e2e.sh"]
    tags: ["locker-v[0-9]+.[0-9]+.[0-9]+", "locker-test-v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: ["app-locker/**", ".github/workflows/applocker.yml", ".github/scripts/locker-e2e.sh"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, like 1.2.0 (leave empty to only run the checks)"
        required: false
      notes:
        description: "Release notes (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: applocker-${{ github.ref }}
  cancel-in-progress: false

env:
  ABIS: armeabi-v7a,arm64-v8a,x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this is a release
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V=""; TEST=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              locker-test-v*) V="${GITHUB_REF_NAME#locker-test-v}"; TEST=true ;;
              *) V="${GITHUB_REF_NAME#locker-v}" ;;
            esac
          else V="$INPUT_VERSION"; fi
          if [ "$TEST" = "true" ]; then RELTAG=locker-test; APKNAME=app-locker-test.apk; else RELTAG=locker-latest; APKNAME=app-locker.apk; fi
          if [ -z "$V" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "Checks only (no version given)"; exit 0
          fi
          if ! [[ "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$V')"; exit 1
          fi
          MAJ=${BASH_REMATCH[1]}; MIN=${BASH_REMATCH[2]}; PAT=${BASH_REMATCH[3]}
          if [ "$MIN" -gt 99 ] || [ "$PAT" -gt 99 ]; then
            echo "::error::Minor and patch numbers must be between 0 and 99"; exit 1
          fi
          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          # Refuse duplicates and downgrades against what is published.
          if gh release download "$RELTAG" -p version.json -D prev 2>/dev/null; then
            PREV=$(jq -r '.versionCode' prev/version.json)
            if [ "$CODE" -le "$PREV" ]; then
              echo "::error::Version $V (code $CODE) is not higher than the published code $PREV"; exit 1
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VTAG="$GITHUB_REF_NAME"; else VTAG="locker-v$V"; fi
          echo "vtag=$VTAG" >> "$GITHUB_OUTPUT"
          echo "reltag=$RELTAG" >> "$GITHUB_OUTPUT"
          echo "apkname=$APKNAME" >> "$GITHUB_OUTPUT"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Release needs the private signing key
        if: steps.mode.outputs.release == 'true' && steps.mode.outputs.test != 'true'
        env:
          KS: ${{ secrets.APPLOCKER_KEYSTORE_BASE64 }}
          PW: ${{ secrets.APPLOCKER_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.APPLOCKER_KEY_ALIAS }}
          KP: ${{ secrets.APPLOCKER_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ] || [ -z "$AL" ] || [ -z "$KP" ]; then
            echo "::error::Missing signing secrets. Add APPLOCKER_KEYSTORE_BASE64, APPLOCKER_KEYSTORE_PASSWORD, APPLOCKER_KEY_ALIAS and APPLOCKER_KEY_PASSWORD (see docs/APP_LOCKER_RELEASE.md). The debug key is never used for a release."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-locker/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "" # the runner already ships the SDK

      - name: Install dependencies
        working-directory: app-locker
        run: npm ci

      - name: Type check
        working-directory: app-locker
        run: npx tsc --noEmit

      - name: JavaScript tests
        working-directory: app-locker
        run: npx jest --ci

      - name: Kotlin unit tests
        working-directory: app-locker/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build the debug APK (used by the emulator test)
        working-directory: app-locker/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator test (lock screen really appears)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/locker-e2e.sh app-locker/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build the release APK (private key, or debug-signed in test mode)
        if: steps.mode.outputs.release == 'true'
        working-directory: app-locker/android
        env:
          APPLOCKER_KEYSTORE_BASE64: ${{ secrets.APPLOCKER_KEYSTORE_BASE64 }}
          APPLOCKER_KEYSTORE_PASSWORD: ${{ secrets.APPLOCKER_KEYSTORE_PASSWORD }}
          APPLOCKER_KEY_ALIAS: ${{ secrets.APPLOCKER_KEY_ALIAS }}
          APPLOCKER_KEY_PASSWORD: ${{ secrets.APPLOCKER_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.mode.outputs.test }}" = "true" ]; then
            # TEST build: public debug key, only for trying the app. Never used for a real release.
            ./gradlew assembleRelease --no-daemon -PallowDebugSigning=true \
              -PreactNativeArchitectures=$ABIS \
              -PappVersionName="${{ steps.mode.outputs.name }}" \
              -PappVersionCode="${{ steps.mode.outputs.code }}"
          else
            echo "$APPLOCKER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export APPLOCKER_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --no-daemon \
              -PreactNativeArchitectures=$ABIS \
              -PappVersionName="${{ steps.mode.outputs.name }}" \
              -PappVersionCode="${{ steps.mode.outputs.code }}"
            rm -f "$RUNNER_TEMP/release.jks"
          fi

      - name: Verify the APK (signature, no internet permission) and describe it
        if: steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app-locker/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt
          SIGNER=$(grep -m1 "certificate SHA-256 digest" cert.txt | awk '{print $NF}')
          test -n "$SIGNER"
          # A real release must NOT be signed with the public debug key. A test build is, by design.
          if [ "${{ steps.mode.outputs.test }}" != "true" ] && grep -qi "Android Debug" cert.txt; then
            echo "::error::Signed with the debug key"; exit 1
          fi

          # Privacy promise: the release app has no internet permission.
          "$BT/aapt2" dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::The release APK asks for INTERNET. App Locker must not."; exit 1
          fi

          # Updates only install over an app signed with the same key, so never change it silently.
          if [ "${{ steps.mode.outputs.test }}" != "true" ] && gh release download locker-latest -p version.json -D prev 2>/dev/null; then
            PREV_SIGNER=$(jq -r '.signerSha256 // empty' prev/version.json)
            if [ -n "$PREV_SIGNER" ] && [ "$PREV_SIGNER" != "$SIGNER" ]; then
              echo "::error::Signing certificate changed; installed apps could not update. Aborting."; exit 1
            fi
          fi

          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          NOTES="${{ inputs.notes }}"; [ -n "$NOTES" ] || NOTES="Version ${{ steps.mode.outputs.name }}"
          cp "$APK" "${{ steps.mode.outputs.apkname }}"
          jq -n \
            --argjson versionCode "${{ steps.mode.outputs.code }}" \
            --arg versionName "${{ steps.mode.outputs.name }}" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/${{ steps.mode.outputs.reltag }}/${{ steps.mode.outputs.apkname }}" \
            --arg sha256 "$SHA" --argjson fileSize "$SIZE" \
            --arg signerSha256 "$SIGNER" --arg releaseNotes "$NOTES" \
            '{versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sha256:$sha256, fileSize:$fileSize, signerSha256:$signerSha256, releaseNotes:$releaseNotes}' > version.json
          cat version.json
          echo "$SHA  ${{ steps.mode.outputs.apkname }}" > "${{ steps.mode.outputs.apkname }}.sha256"

      - name: Publish the APK, its checksum and version.json
        if: steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELTAG: ${{ steps.mode.outputs.reltag }}
          APKNAME: ${{ steps.mode.outputs.apkname }}
        run: |
          if [ "${{ steps.mode.outputs.test }}" = "true" ]; then
            gh release view "$RELTAG" >/dev/null 2>&1 || gh release create "$RELTAG" --prerelease --latest=false \
              --title "App Locker TEST build (debug-signed)" \
              --notes "TEST build for trying App Locker on your own phone. Signed with the public Android debug key, NOT a private release key, so it is not an official release. You will have to uninstall it before installing a properly signed version later. No internet permission. Built by the pipeline from the tagged code and checked on an Android emulator; not yet tested on a physical phone."
          else
            # --latest=false: GitHub's "Latest release" must stay the music app's (its website download button uses it).
            gh release view "$RELTAG" >/dev/null 2>&1 || gh release create "$RELTAG" --latest=false \
              --title "App Locker (latest)" \
              --notes "Newest App Locker APK that passed all checks and the emulator test."
          fi
          # APK first, manifest last: the manifest only changes once the file it describes is in place.
          gh release upload "$RELTAG" "$APKNAME" "$APKNAME.sha256" --clobber
          gh release upload "$RELTAG" version.json --clobber

          # Also keep this version permanently, so the Apps page can list previous versions.
          VER="${{ steps.mode.outputs.name }}"
          VTAG="${{ steps.mode.outputs.vtag }}"
          if [ "${{ steps.mode.outputs.test }}" = "true" ]; then
            VAPK="app-locker-test-${VER}.apk"; PRE="--prerelease"; TITLE="App Locker ${VER} (TEST, debug-signed)"
          else
            VAPK="app-locker-${VER}.apk"; PRE=""; TITLE="App Locker ${VER}"
          fi
          cp "$APKNAME" "$VAPK"
          sha256sum "$VAPK" > "$VAPK.sha256"
          gh release view "$VTAG" >/dev/null 2>&1 || gh release create "$VTAG" $PRE --latest=false --target "$GITHUB_SHA" \
            --title "$TITLE" --notes "App Locker ${VER}"
          gh release upload "$VTAG" "$VAPK" "$VAPK.sha256" version.json --clobber
          echo "Published ${{ steps.mode.outputs.name }} (versionCode ${{ steps.mode.outputs.code }}) to $RELTAG"
