name: Android smoke test

# Installs the latest built APK in an emulator, launches it, and uploads the log and a screenshot.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest successful APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow android.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Using APK from run $id"
          gh run download "$id" -n music-app-release -D apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke.sh apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-out/
