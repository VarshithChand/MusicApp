name: Android smoke test

# Installs the APK in an emulator, launches it, and uploads the log and a screenshot.
# Runs automatically after every successful "Build Android APK", and can be started by hand.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]

permissions:
  contents: write # needed to publish the release below

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ github.event.workflow_run.id }}"
          if [ -z "$id" ]; then
            id=$(gh run list --workflow android.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Using APK from run $id"
          gh run download "$id" -n music-app-release -D apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke.sh apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-out/

      # Only an APK that stayed alive in the emulator is published, so the download button never serves a broken build.
      - name: Publish APK as the latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(tail -n 1 smoke-out/result.txt | tr -d '\r')" != "ALIVE" ]; then
            echo "App crashed in the emulator; removing any published APK so nobody downloads a broken build."
            gh release delete latest --cleanup-tag --yes || true
            exit 1
          fi
          cp apk/app-release.apk music.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest Android build" \
            --notes "Always the newest APK that passed the launch test. Download music.apk."
          gh release upload latest music.apk --clobber
