name: Rebuild an old version

# One-off helper: rebuilds an OLD version from its git tag and publishes it only as a versioned release, so the Apps page
# can list it under "Previous versions". It never touches the rolling releases (latest, locker-latest, ...), so the
# website's download button is not affected.
#   Actions -> "Rebuild an old version" -> Run workflow: app, ref (an existing tag), version.
# Old builds are rebuilt from the tagged code; they are not the original files and are not emulator-tested.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "music or locker"
        required: true
        type: choice
        options: [music, locker]
      ref:
        description: "Git tag or commit to rebuild, e.g. v0.2.1 or locker-v0.1.1"
        required: true
      version:
        description: "Version to publish it as, like 0.2.1"
        required: true

permissions:
  contents: write

concurrency:
  group: backfill-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Work out the version and names
        id: ver
        env:
          APP: ${{ inputs.app }}
          V: ${{ inputs.version }}
        run: |
          if ! [[ "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "::error::Version must look like 1.2.3"; exit 1; fi
          MAJ=${BASH_REMATCH[1]}; MIN=${BASH_REMATCH[2]}; PAT=${BASH_REMATCH[3]}
          echo "code=$((MAJ * 10000 + MIN * 100 + PAT))" >> "$GITHUB_OUTPUT"
          if [ "$APP" = "music" ]; then
            echo "dir=mobile" >> "$GITHUB_OUTPUT"
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
            echo "apk=music-$V.apk" >> "$GITHUB_OUTPUT"
            echo "title=Music $V" >> "$GITHUB_OUTPUT"
            echo "pre=" >> "$GITHUB_OUTPUT"
          else
            # Old App Locker versions are published as TEST builds (debug-signed), like the current ones.
            echo "dir=app-locker" >> "$GITHUB_OUTPUT"
            echo "tag=locker-test-v$V" >> "$GITHUB_OUTPUT"
            echo "apk=app-locker-test-$V.apk" >> "$GITHUB_OUTPUT"
            echo "title=App Locker $V (TEST, debug-signed)" >> "$GITHUB_OUTPUT"
            echo "pre=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to overwrite a version that already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.ver.outputs.tag }} already exists"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.ver.outputs.dir }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install dependencies
        working-directory: ${{ steps.ver.outputs.dir }}
        run: npm ci

      - name: Build the APK
        working-directory: ${{ steps.ver.outputs.dir }}/android
        run: |
          chmod +x gradlew
          if [ "${{ inputs.app }}" = "locker" ]; then
            ./gradlew assembleRelease --no-daemon -PallowDebugSigning=true \
              -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 \
              -PappVersionName="${{ inputs.version }}" -PappVersionCode="${{ steps.ver.outputs.code }}"
          else
            ./gradlew assembleRelease --no-daemon \
              -PappVersionName="${{ inputs.version }}" -PappVersionCode="${{ steps.ver.outputs.code }}"
          fi

      - name: Check and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ steps.ver.outputs.dir }}/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK"
          if [ "${{ inputs.app }}" = "locker" ]; then
            "$BT/aapt2" dump permissions "$APK" | tee perms.txt
            if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::App Locker must not ask for INTERNET"; exit 1; fi
          fi
          cp "$APK" "${{ steps.ver.outputs.apk }}"
          sha256sum "${{ steps.ver.outputs.apk }}" > "${{ steps.ver.outputs.apk }}.sha256"
          gh release create "${{ steps.ver.outputs.tag }}" ${{ steps.ver.outputs.pre }} --latest=false --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.title }}" \
            --notes "Rebuilt from the tagged code (${{ inputs.ref }}) so earlier versions stay available. Not the original file; not emulator-tested."
          gh release upload "${{ steps.ver.outputs.tag }}" "${{ steps.ver.outputs.apk }}" "${{ steps.ver.outputs.apk }}.sha256"
