<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1014; color: #F4F5F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 28px;">

<div style="display: flex; align-items: center; justify-content: space-between;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em;">Good evening</h1>
<a href="Library.dc.html" aria-label="Profile" style="width: 44px; height: 44px; border-radius: 22px; background: #20242D; display: flex; align-items: center; justify-content: center; color: #F4F5F7;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
</a>
</div>

<section style="display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600;">Recently played</h2>
<div style="display: flex; gap: 14px;">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<a href="Player.dc.html" style="display: flex; flex-direction: column; gap: 8px; width: 108px; text-decoration: none; color: inherit;">
<div style="width: 108px; height: 108px; border-radius: 16px; background: {{r.c1}}; position: relative; overflow: hidden;">
<div style="position: absolute; width: 72px; height: 72px; border-radius: 50%; background: {{r.c2}}; right: -18px; bottom: -18px;"></div>
</div>
<div style="font-size: 14px; font-weight: 600;">{{r.title}}</div>
</a>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px;">
<h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 600;">Popular</h2>
<sc-for list="{{popular}}" as="s" hint-placeholder-count="3">
<a href="Player.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; text-decoration: none; color: inherit;">
<div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; background: {{s.c1}}; position: relative; overflow: hidden;">
<div style="position: absolute; width: 34px; height: 34px; border-radius: 50%; background: {{s.c2}}; right: -10px; bottom: -10px;"></div>
</div>
<div style="flex-grow: 1; min-width: 0;">
<div style="font-size: 15px; font-weight: 600;">{{s.title}}</div>
<div style="font-size: 13px; color: #A3A9B5;">{{s.artist}}</div>
</div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color: #A3A9B5;" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
</a>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600;">Artists</h2>
<div style="display: flex; gap: 18px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 76px;">
<div style="width: 76px; height: 76px; border-radius: 38px; background: #2F5D50;"></div>
<span style="font-size: 13px; font-weight: 500;">SoundHelix</span>
</div>
</div>
</section>
</div>

<div style="margin: 0 12px 8px; padding: 8px 12px 10px; border-radius: 16px; background: #20242D; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 12px;">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: #3B4A6B; position: relative; overflow: hidden;">
<div style="position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #556A96; right: -8px; bottom: -8px;"></div>
</div>
<a href="Player.dc.html" style="flex-grow: 1; min-width: 0; text-decoration: none; color: inherit;">
<div style="font-size: 14px; font-weight: 600;">Demo Song 1</div>
<div style="font-size: 12px; color: #A3A9B5;">SoundHelix</div>
</a>
<button type="button" aria-label="Pause" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFC53D; color: #1A1400; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
</button>
</div>
<div style="height: 3px; border-radius: 2px; background: #2F3440;"><div style="width: 34%; height: 3px; border-radius: 2px; background: #FFC53D;"></div></div>
</div>

<nav style="display: flex; justify-content: space-around; padding: 6px 8px 26px; border-top: 1px solid #20242D;">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #FFC53D;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #A3A9B5;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>Search</a>
<a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #A3A9B5;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M9 4v16M14 6l5 14"/></svg>Library</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
recent: [
{ title: 'Demo Song 1', c1: '#3B4A6B', c2: '#556A96' },
{ title: 'Demo Song 3', c1: '#6B3B4F', c2: '#964F6D' },
{ title: 'Demo Song 5', c1: '#2F5D50', c2: '#41806F' }
],
popular: [
{ title: 'Demo Song 2', artist: 'SoundHelix', c1: '#7A5C2E', c2: '#A87C3F' },
{ title: 'Demo Song 4', artist: 'SoundHelix', c1: '#4B3B6B', c2: '#6A5495' },
{ title: 'Demo Song 3', artist: 'SoundHelix', c1: '#6B3B4F', c2: '#964F6D' }
]
};
}
}
</script>
</body>
</html>
