<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1014; color: #F4F5F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em;">Your library</h1>
<button type="button" aria-label="New playlist" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #20242D; color: #F4F5F7; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>

<div style="display: flex; gap: 8px;">
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #FFC53D; background: #FFC53D; color: #1A1400; font: inherit; font-size: 14px; font-weight: 600;">Playlists</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2A2F3A; background: transparent; color: #F4F5F7; font: inherit; font-size: 14px; font-weight: 600;">Albums</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2A2F3A; background: transparent; color: #F4F5F7; font: inherit; font-size: 14px; font-weight: 600;">Artists</button>
</div>

<section style="display: flex; flex-direction: column; gap: 6px;">
<a href="Player.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 68px; text-decoration: none; color: inherit;">
<div style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 14px; background: #FFC53D; color: #1A1400; display: flex; align-items: center; justify-content: center;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
</div>
<div style="flex-grow: 1; min-width: 0;">
<div style="font-size: 16px; font-weight: 600;">Liked songs</div>
<div style="font-size: 13px; color: #A3A9B5;">Playlist</div>
</div>
</a>
<sc-for list="{{playlists}}" as="p" hint-placeholder-count="3">
<a href="Player.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 68px; text-decoration: none; color: inherit;">
<div style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 14px; background: {{p.c1}}; position: relative; overflow: hidden;">
<div style="position: absolute; width: 40px; height: 40px; border-radius: 50%; background: {{p.c2}}; right: -12px; bottom: -12px;"></div>
</div>
<div style="flex-grow: 1; min-width: 0;">
<div style="font-size: 16px; font-weight: 600;">{{p.name}}</div>
<div style="font-size: 13px; color: #A3A9B5;">Playlist</div>
</div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color: #A3A9B5;" aria-hidden="true"><path d="M7 4.5l12 7.5-12 7.5z"/></svg>
</a>
</sc-for>
</section>
</div>

<div style="margin: 0 12px 8px; padding: 8px 12px 10px; border-radius: 16px; background: #20242D; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 12px;">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: #3B4A6B; position: relative; overflow: hidden;">
<div style="position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #556A96; right: -8px; bottom: -8px;"></div>
</div>
<a href="Player.dc.html" style="flex-grow: 1; min-width: 0; text-decoration: none; color: inherit;">
<div style="font-size: 14px; font-weight: 600;">Demo Song 1</div>
<div style="font-size: 12px; color: #A3A9B5;">SoundHelix</div>
</a>
<button type="button" aria-label="Pause" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFC53D; color: #1A1400; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
</button>
</div>
<div style="height: 3px; border-radius: 2px; background: #2F3440;"><div style="width: 34%; height: 3px; border-radius: 2px; background: #FFC53D;"></div></div>
</div>

<nav style="display: flex; justify-content: space-around; padding: 6px 8px 26px; border-top: 1px solid #20242D;">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #A3A9B5;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #A3A9B5;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>Search</a>
<a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #FFC53D;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M9 4v16M14 6l5 14"/></svg>Library</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
playlists: [
{ name: 'My Playlist', c1: '#2F5D50', c2: '#41806F' },
{ name: 'Focus', c1: '#4B3B6B', c2: '#6A5495' },
{ name: 'Evening', c1: '#6B3B4F', c2: '#964F6D' }
]
};
}
}
</script>
</body>
</html>
