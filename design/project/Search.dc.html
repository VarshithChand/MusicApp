<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
input::placeholder{color:#7C8391}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1014; color: #F4F5F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 20px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em;">Search</h1>

<div style="position: relative;">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search songs, artists, albums or genres</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A9B5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 16px;" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
<input id="q" type="search" value="demo" placeholder="Songs, artists, albums" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px 0 46px; border-radius: 26px; border: 1px solid #FFC53D; background: #171A21; color: #F4F5F7; font: inherit; font-size: 16px;">
</div>

<div style="display: flex; gap: 8px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 14px; font-weight: 600;">{{c.label}}</button>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 6px;">
<h2 style="margin: 0 0 6px; font-size: 18px; font-weight: 600;">Songs</h2>
<sc-for list="{{results}}" as="s" hint-placeholder-count="4">
<a href="Player.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; text-decoration: none; color: inherit;">
<div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; background: {{s.c1}}; position: relative; overflow: hidden;">
<div style="position: absolute; width: 34px; height: 34px; border-radius: 50%; background: {{s.c2}}; right: -10px; bottom: -10px;"></div>
</div>
<div style="flex-grow: 1; min-width: 0;">
<div style="font-size: 15px; font-weight: 600;">{{s.title}}</div>
<div style="font-size: 13px; color: #A3A9B5;">{{s.meta}}</div>
</div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3A9B5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</a>
</sc-for>
</section>
</div>

<nav style="display: flex; justify-content: space-around; padding: 6px 8px 26px; border-top: 1px solid #20242D;">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #A3A9B5;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #FFC53D;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>Search</a>
<a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #A3A9B5;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M9 4v16M14 6l5 14"/></svg>Library</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = { bg: '#FFC53D', fg: '#1A1400', border: '#FFC53D' };
const off = { bg: 'transparent', fg: '#F4F5F7', border: '#2A2F3A' };
return {
chips: [
{ label: 'Songs', ...on },
{ label: 'Artists', ...off },
{ label: 'Albums', ...off },
{ label: 'Genres', ...off }
],
results: [
{ title: 'Demo Song 1', meta: 'SoundHelix · Demo Album', c1: '#3B4A6B', c2: '#556A96' },
{ title: 'Demo Song 2', meta: 'SoundHelix · Demo Album', c1: '#7A5C2E', c2: '#A87C3F' },
{ title: 'Demo Song 3', meta: 'SoundHelix · Demo Album', c1: '#6B3B4F', c2: '#964F6D' },
{ title: 'Demo Song 4', meta: 'SoundHelix · Demo Album', c1: '#4B3B6B', c2: '#6A5495' },
{ title: 'Demo Song 5', meta: 'SoundHelix · Demo Album', c1: '#2F5D50', c2: '#41806F' }
]
};
}
}
</script>
</body>
</html>
